name: CI

on:
  push:
    branches: [devel, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HURL_VERSION: "8.0.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history and tags: the breaking-change check compares the spec
          # with the last release tag (a shallow clone has none, and the check
          # would skip).
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

      - name: Formatting (gofumpt + gci)
        run: make fmt-check

      - name: The lite lint profile is a subset of full, and passes
        run: make lint-profiles

      # vacuum and oasdiff, at the versions pinned in the Makefile; built
      # once per version, then restored from the cache.
      - name: Install vacuum and oasdiff
        uses: ./.github/actions/install-tools
        with:
          tools: vacuum oasdiff

      - name: OpenAPI spec (vacuum)
        run: make openapi-lint

      - name: No OpenAPI change breaks clients of the last release (oasdiff)
        run: make openapi-breaking

      # On a release tag: the spec must name that version (bumped in the
      # release pull request), before the GitHub Release attaches it.
      - name: OpenAPI info.version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/openapi-version.sh "$GITHUB_REF_NAME"

      - name: go.mod and go.sum are tidy and verified
        run: make mod-check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The project targets Go 1.27 (go.mod); add newer releases here.
        go-version: ["1.27.x"]
    name: test (go ${{ matrix.go-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}

      # Tools are installed binaries, at the versions pinned in the Makefile.
      - name: Install gotestsum
        uses: ./.github/actions/install-tools
        with:
          tools: gotestsum

      - name: Vet
        run: go vet ./...

      # make cover leaves the generated mocks out of the coverage; the
      # github-actions format folds output per package and annotates failures.
      - name: Test (race + coverage)
        run: make cover COVERPROFILE=coverage.txt GOTESTSUM_FORMAT=github-actions

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.go-version == '1.27.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

  mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install mockery
        uses: ./.github/actions/install-tools
        with:
          tools: mockery

      - name: Regenerate mocks
        run: make mocks

      - name: Mocks are up to date
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "mocks are stale: run make mocks and commit" >&2; exit 1; }

  # The lite kit (make export-lite) must pass on its own: exported and renamed
  # into a temporary directory, it runs its own make ci there.
  lite-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile
          install-only: true

      - name: Export the lite kit
        run: make export-lite DEST="$RUNNER_TEMP/widget" MODULE=example.com/acme/widget NAME=widget

      - name: The kit pins the template's golangci-lint
        run: |
          want=$(make --no-print-directory print-GOLANGCI_LINT_VERSION)
          have=$(make --no-print-directory -C "$RUNNER_TEMP/widget" print-GOLANGCI_LINT_VERSION)
          [ "$have" = "$want" ] || { echo "::error::_kit/Makefile pins golangci-lint $have, the template $want"; exit 1; }

      - name: make ci in the exported kit
        working-directory: ${{ runner.temp }}/widget
        run: make ci

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  functional:
    # Functional tests: the hurl suite against the built binary (make test-functional).
    # hurl's .deb needs libxml2, renamed libxml2-16 on ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install hurl
        run: |
          curl -fsSLO "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get install -y "./hurl_${HURL_VERSION}_amd64.deb"

      - name: Functional tests (hurl) against a fresh server
        run: make test-functional

  docker:
    # hurl's .deb needs libxml2, renamed libxml2-16 on ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test, functional]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          docker build \
            --build-arg NAME="$(make --no-print-directory print-NAME)" \
            --build-arg SOURCE="$(make --no-print-directory print-SOURCE)" \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ci-image .

      - name: Install hurl
        run: |
          curl -fsSLO "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get install -y "./hurl_${HURL_VERSION}_amd64.deb"

      - name: Smoke test
        run: |
          docker run --rm ci-image -version | tee version.txt
          grep -q " (revision ${{ github.sha }})$" version.txt
          docker run -d --name smoke -p 8080:8080 ci-image
          for i in $(seq 1 20); do
            curl -fsS localhost:8080/healthz && break
            sleep 0.5
          done
          scripts/hurl.sh http://localhost:8080

      - name: Container logs
        if: always()
        run: docker logs smoke || true
