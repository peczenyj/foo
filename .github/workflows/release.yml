name: Release

# Publishes a release tag: the Docker image to ghcr.io/<owner>/<repo> (linux/
# amd64 and linux/arm64), and the OpenAPI spec as an asset of the GitHub
# Release. Runs when a GitHub Release is published (create it once the tag's
# CI run passed), or by hand to (re)publish an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.1.0
        required: true
        type: string
      latest:
        description: Also point the latest image tag at it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # What to publish, checked once for both jobs below.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      tags: ${{ steps.meta.outputs.tags }}
      created: ${{ steps.meta.outputs.created }}
      revision: ${{ steps.git.outputs.revision }}
      name: ${{ steps.git.outputs.name }}
      source: ${{ steps.git.outputs.source }}
    steps:
      # A published release moves latest unless it is a prerelease; a manual
      # run moves it only when asked, so republishing an old tag never moves
      # latest backwards.
      - name: Resolve the tag
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.latest }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag (vX.Y.Z or vX.Y.Z-prerelease)"
            exit 1
          fi
          tags="$IMAGE:$TAG"
          if [ "$LATEST" = true ]; then tags="$tags,$IMAGE:latest"; fi
          {
            echo "tag=$TAG"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0 # all branches, to check that the tag is on main

      - name: The tag is on main; project name and source
        id: git
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main: release tags are cut on main"
            exit 1
          }
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "name=$(make --no-print-directory print-NAME)"
            echo "source=$(make --no-print-directory print-SOURCE)"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context: . builds the checked-out tag; the action's default (the git
      # context of the triggering ref) would build devel on a manual run.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.resolve.outputs.tags }}
          build-args: |
            NAME=${{ needs.resolve.outputs.name }}
            SOURCE=${{ needs.resolve.outputs.source }}
            VERSION=${{ needs.resolve.outputs.tag }}
            REVISION=${{ needs.resolve.outputs.revision }}
            CREATED=${{ needs.resolve.outputs.created }}

      - name: Check the published image
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          docker run --rm "$IMAGE:$TAG" -version | tee version.txt
          grep -q " $TAG (revision " version.txt

  # The spec clients generate code from, at a stable URL:
  # https://github.com/<owner>/<repo>/releases/download/<tag>/openapi.yaml
  spec:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      # Tags cut before the spec existed (v0.3.0 and older) have nothing to
      # attach; a manual run on a tag without a GitHub Release neither.
      - name: Attach api/openapi.yaml to the release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f api/openapi.yaml ]; then
            echo "::notice::$TAG has no api/openapi.yaml: nothing to attach"
            exit 0
          fi
          bash scripts/openapi-version.sh "$TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG has no GitHub Release: nothing to attach the spec to"
            exit 0
          fi
          gh release upload "$TAG" api/openapi.yaml --clobber
          echo "Attached: ${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/openapi.yaml"
