---
version: "2"

run:
  timeout: 5m
  # Lint the integration tests too (//go:build integration).
  build-tags:
    - integration
  modules-download-mode: readonly

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Correctness: HTTP, context, errors, logging.
    - bodyclose
    - canonicalheader
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - err113
    - exhaustive
    - forcetypeassert
    - gosec
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nosprintfhostport
    - reassign
    - recvcheck
    - sloglint
    - usestdlibvars
    - wrapcheck
    # Tests.
    - paralleltest
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
    # Modern, idiomatic Go.
    - copyloopvar
    - intrange
    - modernize
    - perfsprint
    - unconvert
    - unparam
    - wastedassign
    # Style and readability.
    - asciicheck
    - bidichk
    - dupword
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - inamedparam
    - lll
    - mirror
    - misspell
    - mnd
    - nlreturn
    - predeclared
    - prealloc
    - revive
    - whitespace
    - wsl_v5
    # Directives.
    - nolintlint
  settings:
    errcheck:
      # Usage and error messages written to stdout/stderr are best-effort:
      # the server can do nothing useful if that write fails.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      severity: warning
    testifylint:
      enable-all: true
    thelper:
      test:
        # Table-test check closures stay without t.Helper(), so a failure
        # points at the failing case, not at the shared tc.check(...) call.
        begin: false
  exclusions:
    # Generated by mockery (make mocks): never edited by hand.
    paths:
      - mocks
    rules:
      # Table tests are long and repeat literals on purpose; test doubles
      # return made-up errors, never wrapped.
      - path: '_test\.go'
        linters:
          - err113
          - errcheck
          - funlen
          - goconst
          - gocyclo
          - wrapcheck

formatters:
  exclusions:
    paths:
      - mocks
  enable:
    - gofumpt
    - gci
  settings:
    # gci groups the imports: standard library, third party, then this module.
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/peczenyj/foo)
